name: Publicar imagen en Docker Hub

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: docker-publish-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verificar:
    name: Compilar y probar
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci
      - run: npm run build
      - run: npm test

  publicar:
    name: Construir y publicar latest
    needs: verificar
    runs-on: ubuntu-latest
    env:
      IMAGEN: ${{ secrets.DOCKER_USER }}/aguafix-api
    steps:
      - uses: actions/checkout@v4

      # QEMU + Buildx: imagen multi-arquitectura (amd64 para servidores, arm64 para Mac Apple Silicon)
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3

      - name: Login en Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USER }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Construir y publicar
        uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ${{ env.IMAGEN }}:latest
            ${{ env.IMAGEN }}:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verificar que la imagen publicada no contiene secretos
        run: |
          docker pull "$IMAGEN:latest"
          docker run --rm --entrypoint sh "$IMAGEN:latest" -c '
            set -e
            test ! -e /app/.env
            test ! -e /app/compose.yaml
            test -z "$(find /app -maxdepth 1 -name ".env*")"
            test -f /app/dist/main.js
            echo "OK: sin .env ni compose.yaml; dist/main.js presente"
          '
